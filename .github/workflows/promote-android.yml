name: Promote Android release

on:
  workflow_dispatch:
    inputs:
      to_track:
        description: Track to promote the current internal release to
        required: true
        default: production
        type: choice
        options:
          - production
          - beta
          - alpha

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write Play service account credentials
        run: echo '${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}' > "${{ runner.temp }}/play-service-account.json"

      - name: Promote internal release to ${{ inputs.to_track }}
        env:
          PLAY_SERVICE_ACCOUNT_JSON_PATH: ${{ runner.temp }}/play-service-account.json
        run: ./gradlew :composeApp:promoteReleaseArtifact --from-track internal --promote-track ${{ inputs.to_track }}

      - name: Clean up secret files
        if: always()
        run: rm -f "${{ runner.temp }}/play-service-account.json"
