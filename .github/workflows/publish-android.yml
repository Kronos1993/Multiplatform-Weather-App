name: Publish Android to Play Store

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "${{ runner.temp }}/release.keystore.jks"

      - name: Write Play service account credentials
        run: echo '${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}' > "${{ runner.temp }}/play-service-account.json"

      - name: Publish release bundle to Play Store (internal track)
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON_PATH: ${{ runner.temp }}/play-service-account.json
        run: ./gradlew :composeApp:publishReleaseBundle

      - name: Clean up secret files
        if: always()
        run: rm -f "${{ runner.temp }}/release.keystore.jks" "${{ runner.temp }}/play-service-account.json"
